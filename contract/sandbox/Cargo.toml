[package]
name = "condex-contract-sandbox"
version = "0.1.0"
edition = "2021"
description = "Runs the built ConDex contract on a local NEAR node (near-workspaces sandbox), with real accounts and real NEAR."
publish = false

[dev-dependencies]
anyhow = "1"
near-workspaces = "0.24"
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
